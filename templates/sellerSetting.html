<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings - NearBy Dukan</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/sellerDashboard.css') }}">
</head>

<body>

<div class="seller-layout">

<aside class="sidebar">

<div class="sidebar-logo">

<div class="logo-icon">
<i class="fa-solid fa-shop"></i>
</div>

<div>
<h2>NearBy Dukan</h2>
<span>Seller Panel</span>
</div>

</div>


<nav class="sidebar-nav">

<a href="{{ url_for('sellerDashboard') class="nav-link">
<i class="fa-solid fa-chart-pie"></i>
Dashboard
</a>

<a href="{{url('sellerStore')}}" class="nav-link">
<i class="fa-solid fa-store"></i>
My Store
</a>

<a href="{{url_for('sellerProduct')}}" class="nav-link">
<i class="fa-solid fa-box"></i>
Products
</a>

<a href="{{url_for('sellerInventory')}}" class="nav-link">
<i class="fa-solid fa-warehouse"></i>
Inventory
</a>

<a href="{{url_for('sellerOrder')}}" class="nav-link">
<i class="fa-solid fa-cart-shopping"></i>
Orders
</a>

<a href="{{url_for('sellerOffer')}}" class="nav-link">
<i class="fa-solid fa-tags"></i>
Offers
</a>

<a href="{{url_for('sellerCustomer')}}" class="nav-link">
<i class="fa-solid fa-users"></i>
Customers
</a>

<a href="{{url_for('sellerAnalytics')}}" class="nav-link active">
<i class="fa-solid fa-chart-line"></i>
Analytics
</a>

<a href="{{url_for('sellerSetting')}}" class="nav-link">
<i class="fa-solid fa-gear"></i>
Settings
</a>

</nav>

</aside>


<main class="main-content">

<header class="topbar">

<div class="topbar-left">

<h1>Settings</h1>

<p>
Manage your seller account
</p>

</div>

</header>

<section class="dashboard-content">

<div class="dashboard-card">

<div class="card-header">

<div>

<h3>Account Settings</h3>

<p>
Update your personal information
</p>

</div>

</div>


<div class="form-row">

<div class="form-group">

<label>Full Name</label>

<input
value="Rajesh Sharma">

</div>


<div class="form-group">

<label>Email</label>

<input type="email" value="sharma@example.com">
</div>
</div>
<div class="form-row">

<div class="form-group">

<label>Mobile Number</label>

<input
value="9876543210">

</div>
<div class="form-group">
<label>Language</label>
<select>

<option>English</option>
<option>Hindi</option>
<option>Hinglish</option>

</select>

</div>

</div>


<button
class="primary-btn"
onclick="saveSettings()">

Save Changes

</button>

</div>


<div class="dashboard-card">

<div class="card-header">

<div>

<h3>Store Notifications</h3>

<p>
Choose which notifications you receive
</p>

</div>

</div>


<label class="setting-row">

<span>
New Order Notifications
</span>

<input
type="checkbox"
checked>

</label>


<label class="setting-row">

<span>
Low Stock Notifications
</span>

<input
type="checkbox"
checked>

</label>


<label class="setting-row">

<span>
Offer Notifications
</span>

<input
type="checkbox">

</label>

</div>


<div class="dashboard-card">

<div class="card-header">

<div>

<h3>Security</h3>

<p>
Protect your account
</p>

</div>

</div>


<button
class="secondary-btn"
onclick="changePassword()">

Change Password

</button>

</div>

</section>

</main>

</div>


<script src="{{url_for('static',filename='js/sellerDashboard.js')}}"></script>

<script>

function saveSettings() {
alert("Settings saved successfully!");
}
function changePassword() {
    alert("Change password form will open here.");
}

</script>

</body>
</html>
